<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --forest: #1e4838;
    --forest-deep: #153427;
    --cream: #f5edd8;
    --cream-dark: #e8dcc0;
    --sage: #b0d6a0;
    --sage-dark: #7cb278;
  }
  * { box-sizing: border-box; }
  body {
    width: 280px; margin: 0; padding: 20px 18px 18px; text-align: center;
    background: var(--cream); color: var(--forest);
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  }
  img { width: 44px; height: 44px; display: block; margin: 0 auto 8px; }
  h1 {
    margin: 0 0 16px; font: 700 15px/1.2 Georgia, "Times New Roman", serif;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  button {
    width: 100%; padding: 15px 0; border-radius: 40px; cursor: pointer;
    font: 700 21px/1 "Trebuchet MS", "Segoe UI", Arial, sans-serif; letter-spacing: 0.2em;
    color: var(--forest); background: transparent; border: 2.5px solid var(--forest);
    transition: background 0.2s, color 0.2s, transform 0.1s;
  }
  button:hover { background: var(--cream-dark); }
  button:active { transform: scale(0.98); }
  button.on { background: var(--forest); color: var(--cream); border-color: var(--forest); }
  button.on:hover { background: var(--forest-deep); }
  button .dot {
    display: inline-block; width: 9px; height: 9px; margin-right: 10px; border-radius: 50%;
    background: var(--cream-dark); vertical-align: 1px; border: 1.5px solid var(--forest);
  }
  button.on .dot { background: var(--sage); border-color: var(--sage); box-shadow: 0 0 0 3px rgba(176, 214, 160, .3); }
  p { margin: 14px 4px 0; font-size: 14px; line-height: 1.45; color: #4a6b5a; }
  p b { color: var(--sage-dark); }
  label.opt {
    display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 14px;
    font-size: 13.5px; color: #4a6b5a; cursor: pointer; user-select: none;
  }
  button#report { width: auto; padding: 0; margin-top: 14px; border: 0; border-radius: 0; background: none; font: 600 12.5px/1.3 "Trebuchet MS", "Segoe UI", Arial, sans-serif; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; color: #4a6b5a; }
  button#report:hover { background: none; color: var(--forest); }
  select#mode {
    width: 100%; margin-top: 14px; padding: 8px 10px; border: 1.5px solid var(--forest); border-radius: 10px;
    background: transparent; color: var(--forest); font: 600 13.5px/1.3 "Trebuchet MS", "Segoe UI", Arial, sans-serif; cursor: pointer;
  }
  .note { margin-top: 4px; font-size: 12.5px; color: #8a6a00; min-height: 0; }
  label.opt input { accent-color: var(--forest); margin: 0; cursor: pointer; }

  /* Phones and tablets (Firefox for Android shows this page full width, not as a small bubble):
     fill the screen width, bigger text, and touch targets of at least 48 px */
  @media (pointer: coarse) {
    body { width: auto; max-width: 520px; margin: 0 auto; padding: 28px 20px 32px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    img { width: 64px; height: 64px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin-bottom: 24px; }
    button#toggle { padding: 20px 0; font-size: 26px; min-height: 64px; }
    button .dot { width: 12px; height: 12px; margin-right: 12px; }
    p { margin: 20px 4px 0; font-size: 17px; line-height: 1.5; }
    select#mode { margin-top: 22px; padding: 14px 14px; min-height: 52px; font-size: 17px; border-radius: 14px; }
    label.opt { margin-top: 22px; gap: 12px; font-size: 16px; line-height: 1.4; text-align: left; min-height: 48px; }
    label.opt input { width: 24px; height: 24px; flex: none; }
    button#report { margin-top: 18px; padding: 14px 8px; min-height: 48px; font-size: 16px; }
    .note { font-size: 15px; margin-top: 8px; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
  <img src="icons/icon48.png" alt="">
  <h1 id="title">Only Natural</h1>
  <button id="toggle"><span class="dot"></span><span id="label">OFF</span></button>
  <p id="hint"></p>
  <select id="mode"></select>
  <label class="opt" id="siteRow" style="display:none"><input type="checkbox" id="site"><span id="siteLabel"></span></label>
  <div id="siteNote" class="note"></div>
  <button id="report" type="button"></button>
  <div id="reportNote" class="note"></div>
  <script src="i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/de.js"></script>
  <script src="lang/fr.js"></script>
  <script src="lang/es.js"></script>
  <script src="lang/it.js"></script>
  <script src="lang/nl.js"></script>
  <script src="lang/pt.js"></script>
  <script src="lang/ko.js"></script>
  <script src="lang/ja.js"></script>
  <script src="lang/zh.js"></script>
  <script src="popup.js"></script>
</body>
</html>
